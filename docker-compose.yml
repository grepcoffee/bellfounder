services:
  ollama:
    image: ollama/ollama:latest
    container_name: bellfounder-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"   # optional - handy for `curl localhost:11434` debugging, not needed by bellfounder itself
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Uncomment if this host has an NVIDIA GPU + nvidia-container-toolkit -
    # CPU-only works fine, just slower (see PLAN.md section 5).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot: pulls the model into the ollama_data volume on first start.
  # Safe to re-run - `ollama pull` is a no-op if already present. Check
  # `docker compose logs -f ollama-pull` to watch download progress.
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - 'curl -sS http://ollama:11434/api/pull -d "{\"name\": \"${BF_MODEL:-qwen2.5:7b}\"}"'

  bellfounder:
    build: .
    container_name: bellfounder
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - BF_MODEL=${BF_MODEL:-qwen2.5:7b}
      - BF_ROAST_INTERVAL_S=${BF_ROAST_INTERVAL_S:-120}
      - SQ_HOST=${SQ_HOST:-}                       # empty = SQ link disabled
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}   # empty = no Slack summary
    volumes:
      - bellfounder_data:/data
    ports:
      - "8095:8095"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8095/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bellfounder_data:
  ollama_data:
